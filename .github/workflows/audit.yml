name: GEO audit & llms.txt

# - Bei Push (Graph/Ontologie geaendert): nur llms.txt neu erzeugen (kostenlos).
# - Woechentlich und manuell: zusaetzlich das GEO-Audit (verursacht API-Kosten).
# Ergebnisse werden zurueck ins Repo committet (zugleich die Persistenz).

on:
  push:
    branches: [main]
    paths:
      - "data/graph.jsonld"
      - "ontology.yaml"
      - "geo/llmstxt.py"
  schedule:
    - cron: "17 6 * * 1"   # Montags 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: geo-audit
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Regenerate llms.txt
        run: python cli.py llmstxt

      - name: Run GEO audit (not on push)
        if: ${{ github.event_name != 'push' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          MAX_CALLS_PER_AUDIT: ${{ vars.MAX_CALLS_PER_AUDIT }}
        run: python cli.py audit

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add llms.txt data/audits/ || true
          if git diff --cached --quiet; then
            echo "Keine Aenderungen."
          else
            git commit -m "chore: llms.txt und Audit-Ergebnisse aktualisieren"
            git push
          fi
